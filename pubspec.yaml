name: healthlink_connect_flutter
description: A new Flutter project for MediConnect.
version: 1.0.12+13

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  flutter_dotenv: ^6.0.0

  # State Management
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^17.1.0

  # Networking
  dio: ^5.4.3+1

  # DI
  get_it: ^9.2.1

  # Storage
  flutter_secure_storage: ^10.0.0
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  flutter_svg: ^2.0.10+1
  intl: 0.20.2
  logger: ^2.4.0
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  firebase_messaging: ^16.1.3
  google_sign_in: ^6.2.1
  web_socket_channel: ^3.0.0
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  flutter_pdfview: ^1.3.1
  razorpay_flutter: ^1.3.5
  cached_network_image: ^3.3.1
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  url_launcher: ^6.2.5
  flutter_cashfree_pg_sdk: ^2.2.10+48

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/mediconnect_logo.png
    - assets/images/
    - assets/icons/
    - assets/animations/
  # fonts:
  #   - family: Outfit
  #     fonts:
  #       - asset: assets/fonts/Outfit-Regular.ttf
  #       - asset: assets/fonts/Outfit-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/mediconnect_logo.png
    background_color: "#0D9488"
    theme_color: "#0D9488"
  image_path: assets/images/mediconnect_logo.png
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: assets/images/mediconnect_logo.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/images/mediconnect_logo_splash.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#F8FAFC"
    image: assets/images/mediconnect_logo_splash.png
