name: healthlink_connect_flutter
description: A new Flutter project for HealthLink Connect.
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0

  # State Management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.3.0

  # Networking
  dio: ^5.7.0

  # DI
  get_it: ^7.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  flutter_svg: ^2.0.10+1
  intl: 0.20.2
  logger: ^2.4.0
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  flutter_pdfview: ^1.4.4
  razorpay_flutter: ^1.4.1
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/mediconnect_logo.png
    - assets/images/
    - assets/icons/
    - assets/animations/
  # fonts:
  #   - family: Outfit
  #     fonts:
  #       - asset: assets/fonts/Outfit-Regular.ttf
  #       - asset: assets/fonts/Outfit-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/mediconnect_logo.png
    background_color: "#0D9488"
    theme_color: "#0D9488"
  image_path: assets/images/mediconnect_logo.png
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: assets/images/mediconnect_logo.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F8FAFC"
  image: assets/images/mediconnect_logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#F8FAFC"
    image: assets/images/mediconnect_logo.png
